
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "german-property-energy-management"
version = "0.1.0"
description = "An AI-powered energy monitoring, forecasting, and optimization prototype for German properties."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "streamlit",
    "reportlab",
    "scikit-learn",
    "statsmodels",
    "python-dotenv",
    "langchain==1.5.0",
    "langchain-openai==1.7.4",
    "langgraph==1.2.21",
    "pydantic==2.14.3",
    "openai==3.50.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Only the main Capstone project tests no Hometask files
testpaths = ["tests"]
# allows "import backend" to work without pip install -e .
pythonpath = ["src"]
